    <text x="0" y="42" class="label">SQL Server</text>
  </g>

  <!-- MongoDB -->
  <g transform="translate(560, 200)">
    <animateTransform attributeName="transform" type="translate" from="560 240" to="560 200" begin="1.8s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.6s" fill="freeze"/>
    <image href="https://raw.githubusercontent.com/devicons/devicon/master/icons/mongodb/mongodb-original-wordmark.svg" x="-32" y="-32" width="64" height="64"/>
    <text x="0" y="42" class="label">MongoDB</text>
  </g>

  <!-- Git -->
  <g transform="translate(660, 200)">
    <animateTransform attributeName="transform" type="translate" from="660 240" to="660 200" begin="1.95s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
