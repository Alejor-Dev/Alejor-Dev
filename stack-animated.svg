  <g transform="translate(460, 200)">
    <animateTransform attributeName="transform" type="translate" from="460 240" to="460 200" begin="1.65s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <animate attributeName="opacity" from="0" to="1" begin="1.65s" dur="0.6s" fill="freeze"/>
