    <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.6s" fill="freeze"/>
    <image href="https://raw.githubusercontent.com/devicons/devicon/master/icons/java/java-original.svg" x="-25" y="-25" width="50" height="50"/>
    <text x="0" y="42" class="label">Java</text>
  </g>

