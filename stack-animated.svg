<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="300" viewBox="0 0 720 300">
  <style>
    .label { font-family: 'Fira Code', monospace; font-size: 12px; fill: #8892b0; text-anchor: middle; }
    .title { font-family: 'Fira Code', monospace; font-size: 16px; font-weight: bold; fill: #ccd6f6; }
  </style>

  <text x="360" y="24" class="title" text-anchor="middle">STACK TECNOLÓGICO</text>

  <!-- Python -->
  <g transform="translate(90, 80)">
    <animateTransform attributeName="transform" type="translate" from="90 120" to="90 80" begin="0s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.6s" fill="freeze"/>
    <image href="https://raw.githubusercontent.com/devicons/devicon/master/icons/python/python-original.svg" x="-25" y="-25" width="50" height="50"/>
    <text x="0" y="42" class="label">Python</text>
  </g>

  <!-- JavaScript -->
  <g transform="translate(170, 80)">
    <animateTransform attributeName="transform" type="translate" from="170 120" to="170 80" begin="0.15s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.6s" fill="freeze"/>
    <image href="https://raw.githubusercontent.com/devicons/devicon/master/icons/javascript/javascript-original.svg" x="-25" y="-25" width="50" height="50"/>
    <text x="0" y="42" class="label">JavaScript</text>
  </g>

