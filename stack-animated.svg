  <g transform="translate(90, 200)">
    <animateTransform attributeName="transform" type="translate" from="90 240" to="90 200" begin="2.1s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.6s" fill="freeze"/>
    <image href="https://raw.githubusercontent.com/devicons/devicon/master/icons/docker/docker-original.svg" x="-25" y="-25" width="50" height="50"/>
    <text x="0" y="42" class="label">Docker</text>
